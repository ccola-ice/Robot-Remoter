<h1>机器人遥控器 · 字体、日历与菜单页面</h1>
<p>以下画面由实际 C 页面函数、LCD 绘制代码和项目 ASCII 字库生成，原始尺寸为 800 × 480。中文使用主机模拟的外部 GB2312 字库，实板字形以已烧录字库为准；模拟字库没有进入固件。日期、输入、电量、文件和无线状态为演示数据，机器人遥测保持未连接状态。</p>
<p>设置列表采用固定 32 px 加粗文字；上/下支持长按连发。日历入口在“设置 → 日历时钟”，支持手动设置与 GPS 校时。<a href="../字体长按与日历时钟.md">操作与验证说明</a></p>
<nav><a href="#params">参数设置</a><a href="#calendar">日历时钟</a><a href="#edit">日期时间设置</a><a href="#settings">设置菜单</a><a href="#wireless">无线设置</a><a href="#home">首页</a><a href="#apps">工具菜单</a><a href="#raw">原始采样</a><a href="#output">通道输出</a><a href="#robot">机器人控制</a><a href="#files">文件浏览</a></nav>

<figure id="calendar"><figcaption>日历时钟<small>月历、当前日期时间与校时来源</small></figcaption><a href="calendar.png"><img src="calendar.png" width="800" height="480" alt="日历时钟"></a></figure>
<figure id="edit"><figcaption>日期时间设置<small>逐字段修改并确认保存</small></figcaption><a href="calendar-edit.png"><img src="calendar-edit.png" width="800" height="480" alt="日期时间设置"></a></figure>
<figure id="settings"><figcaption>设置菜单<small>参数、无线和日历三个入口</small></figcaption><a href="settings-menu.png"><img src="settings-menu.png" width="800" height="480" alt="设置菜单"></a></figure>
<figure id="wireless"><figcaption>无线设置<small>固定字号配置列表与当前生效值</small></figcaption><a href="wireless-settings.png"><img src="wireless-settings.png" width="800" height="480" alt="无线设置"></a></figure>
